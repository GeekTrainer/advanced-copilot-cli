name: Content Suggestion
description: Suggest new content or an improvement to the course
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What's missing, confusing, or hard to follow in the course today? Describe the learner problem you're trying to solve.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed content
      description: Describe the content, module, or exercise you'd like added or changed.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Related module
      description: Which module would this affect or belong to, if any (e.g. `content/05-add-feature-barcode.md`)?
      placeholder: content/NN-short-slug.md
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches or framings you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or references about the suggestion.
